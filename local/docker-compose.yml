services:
  db:
    container_name: benchmark_catalog_db
    image: pgvector/pgvector:0.8.1-pg16

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    container_name: benchmark_catalog_vault
    image: hashicorp/vault:latest

    cap_add:
      - IPC_LOCK

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    command: server -dev

    ports:
      - "8200:8200"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN} vault status >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  vault-init:
    container_name: benchmark_catalog_vault_init
    image: hashicorp/vault:latest

    depends_on:
      vault:
        condition: service_healthy

    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - |
        echo "Checking Transit mount..."

        vault secrets list -format=json |
          grep -q '"transit/"' ||
          vault secrets enable transit

        echo "Checking HMAC key..."

        vault read transit/keys/benchmark-catalog-external-api \
          >/dev/null 2>&1 ||
        vault write transit/keys/benchmark-catalog-external-api \
          type=hmac \
          key_size=32 \
          exportable=false \
          allow_plaintext_backup=false

        echo "Vault Transit initialization completed"

    restart: "no"

volumes:
  postgres_data:
